name: Предложение
description: Идея новой функции или улучшения
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу с точки зрения пилота: что вы хотите делать и почему
        это важно. Помните про офлайн-принцип: без внешних CDN и сервисов.

  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Профили самолётов / приборы
        - Веб-клиент / панель
        - Редактор панелей
        - Android-приложение
        - Шлюз / протокол
        - Установщик / сборка
        - Документация
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решает?
      placeholder: |
        При ночном полёте панель слишком яркая, приходится...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы и ограничения
      description: Что уже пробовали, какие есть риски/ограничения
    validations:
      required: false
