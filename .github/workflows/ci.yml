name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: python -m ruff check msfs_gateway tests scripts

      - name: Format check
        run: python -m ruff format --check msfs_gateway tests scripts

      - name: Compile
        run: python -m compileall -q msfs_gateway tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: node --check web/js/main.js

      - name: Tests
        run: node --test tests/web/*.test.mjs

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --console=plain assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rud-panel-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  installer:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Android APK for the bundle
        working-directory: android
        run: |
          gradle --no-daemon --console=plain assembleDebug
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item app/build/outputs/apk/debug/app-debug.apk dist/RudPanel-Android-0.1.0.apk

      - name: Install build tools
        run: |
          python -m pip install pyinstaller
          choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: pwsh -File scripts/build-installer.ps1 -Version 0.1.0 -NsisPath "C:\Program Files (x86)\NSIS"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: rud-panel-installer
          path: dist/*.exe
          if-no-files-found: error
